services:
  e2b:
    image: llama-cpp-dgx
    container_name: gemma4-e2b
    ports:
      - "8082:8082"
    volumes:
      - ./models/gemma4-e2b:/models:ro
    command:
      - -m /models/gemma-4-E2B-it-Q4_K_M.gguf
      - --host 0.0.0.0
      - --port 8082
      - -ngl 999
      - -c 8192
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

